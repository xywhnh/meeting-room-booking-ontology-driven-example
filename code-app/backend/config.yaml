# 应用配置（所有可变项配置化，禁止硬编码）
app:
  name: 会议室预定管理系统
  host: 0.0.0.0
  port: 5000
  secret_key: change-me-in-production
  database: data/app.db

auth:
  jwt_secret: please-change-this-jwt-secret
  jwt_expires_hours: 2
  default_admin: admin
  default_admin_password: admin123

# AI 对话：本示例为本地规则助手（services/assistant_service.py），不调用外部大模型，故 ai.enabled 保持 false
ai:
  enabled: false
  provider: deepseek
  api_key: ""
  base_url: ""
  model: deepseek-chat

# 只读动态 SQL 边界
sql_readonly:
  max_rows: 200
  timeout_seconds: 5
