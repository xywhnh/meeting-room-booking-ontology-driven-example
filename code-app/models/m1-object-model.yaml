# M1 对象模型 - 会议室预定管理域
# 依据《会议室预定需求规格说明书-V9.md》第三部分 + 附录 C.1
# 说明：本文件沿用 sharptoolbox/ontology-driven-dev 的七模型 YAML 写法。
# 它是该技能意义上的“本体模型”（领域对象 / 行为 / 规则的 YAML 规约），
# 不是 OWL/RDF 形式本体；不要把它与形式化本体（OWL）混为一谈。
model_type: OBJECT
version: "1.0"
domain: "会议室预定管理"

aggregates:
  - id: AGG-ROOM-001
    name: 会议室
    alias: MeetingRoom
    aggregateType: AGGREGATE_ROOT
    description: 会议室主数据，本系统维护，被预定单引用；示例种子见后端 seed.py
    lifecycle: [在用, 停用]
    tags: [主数据]
    attributes:
      - name: roomNo
        label: 会议室编号
        type: String
        required: true
        unique: true
      - name: roomName
        label: 会议室名称
        type: String
        required: true
      - name: capacity
        label: 容纳人数
        type: Integer
        required: true
      - name: location
        label: 位置
        type: String
        required: false
      - name: status
        label: 状态
        type: Enum
        enumValues: [在用, 停用]
        required: true
        defaultValue: 在用

  - id: AGG-BOOKING-001
    name: 预定单
    alias: Booking
    aggregateType: AGGREGATE_ROOT
    description: 一次会议室预定申请。提交后进入预定审批流；审批通过即视为该时段已占用。
    lifecycle: [草稿, 待部门主管审批, 待行政经理审批, 已通过, 已驳回]
    tags: [核心域]
    attributes:
      - name: bookingNo
        label: 预定编号
        type: String
        required: true
        unique: true
      - name: roomId
        label: 会议室
        type: AggregateRootRef
        targetAggregate: AGG-ROOM-001
        required: true
      - name: bookingDate
        label: 预定日期
        type: Date
        required: true
      - name: startTime
        label: 开始时间
        type: String
        required: true
      - name: endTime
        label: 结束时间
        type: String
        required: true
      - name: purpose
        label: 会议主题
        type: String
        required: true
      - name: participants
        label: 参会人数
        type: Integer
        required: true
      - name: status
        label: 审批状态
        type: Enum
        enumValues: [草稿, 待部门主管审批, 待行政经理审批, 已通过, 已驳回]
        required: true
        defaultValue: 草稿
      - name: applicantId
        label: 申请人 ID
        type: Integer
        required: false
      - name: applicantName
        label: 申请人
        type: String
        required: false
      # 以下为技能约定的 5 个默认字段：界面不显示，写入时自动赋值；逻辑删除用 flag=0
      - name: createdBy
        label: 创建人
        type: Integer
        required: false
      - name: createdAt
        label: 创建时间
        type: DateTime
        required: false
      - name: updatedBy
        label: 更新人
        type: Integer
        required: false
      - name: updatedAt
        label: 更新时间
        type: DateTime
        required: false
      - name: flag
        label: 有效标志
        type: Integer
        required: true
        defaultValue: 1
