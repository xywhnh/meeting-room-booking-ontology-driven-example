# MU UI 模型 - 会议室预定管理域
model_type: UI
version: "1.0"
domain: "会议室预定管理"

application:
  name: 会议室预定管理系统
  menus:
    - menuId: menu-booking
      name: 预定管理
      children:
        - menuId: menu-booking-apply
          name: 预定申请
          screenRef: frmBookingApply
        - menuId: menu-booking-query
          name: 预定查询
          screenRef: frmBookingQuery
        - menuId: menu-room
          name: 会议室管理
          screenRef: frmRoomManage
        - menuId: menu-room-summary
          name: 会议室预定统计
          screenRef: frmRoomSummaryReport
    - menuId: menu-workbench
      name: 审批中心
      children:
        - menuId: menu-workbench-todo
          name: 我的待办
          screenRef: frmBookingApproval
        - menuId: menu-workbench-done
          name: 我的已办
          screenRef: frmBookingApproval
        - menuId: menu-workbench-requested
          name: 我的申请
          screenRef: frmRequested
    - menuId: menu-flow
      name: 流程管理
      children:
        - menuId: menu-flow-definition
          name: 流程定义
          screenRef: frmFlowDefinition
        - menuId: menu-flow-instance
          name: 流程实例
          screenRef: frmFlowInstance
        - menuId: menu-flow-task
          name: 任务管理
          screenRef: frmFlowTask
    - menuId: menu-system
      name: 系统管理
      children:
        - menuId: menu-system-user
          name: 用户管理
          screenRef: frmUserManage
        - menuId: menu-system-role
          name: 角色管理
          screenRef: frmRoleManage
        - menuId: menu-system-permission
          name: 权限管理
          screenRef: frmPermissionManage
        - menuId: menu-system-resource
          name: 资源管理
          screenRef: frmResourceManage

screens:
  - screenId: frmBookingApply
    name: 预定申请
    screenType: SINGLE_FORM
    elements:
      - { id: cboRoom, type: COMBO, label: 会议室, required: true, dataBinding: Booking.roomId }
      - { id: txtBookingDate, type: DATE, label: 预定日期, required: true, dataBinding: Booking.bookingDate }
      - { id: txtStartTime, type: TIME, label: 开始时间, required: true, dataBinding: Booking.startTime }
      - { id: txtEndTime, type: TIME, label: 结束时间, required: true, dataBinding: Booking.endTime }
      - { id: txtPurpose, type: TEXTBOX, label: 会议主题, required: true, dataBinding: Booking.purpose }
      - { id: txtParticipants, type: NUMBER, label: 参会人数, required: true, dataBinding: Booking.participants }
    actions:
      - { actionId: actSaveDraft, name: 暂存, actionType: DRAFT, behaviorRef: Booking_SaveAsDraft }
      - { actionId: actSubmit, name: 提交, actionType: SUBMIT, behaviorRef: Booking_Submit }

  - screenId: frmBookingQuery
    name: 预定查询
    screenType: QUERY_LIST
    elements:
      - { id: txtBookingNo, type: TEXTBOX, label: 预定编号, dataBinding: Booking.bookingNo }
      - { id: cboRoom, type: COMBO, label: 会议室, dataBinding: Booking.roomId }
      - { id: txtBookingDate, type: DATE, label: 预定日期, dataBinding: Booking.bookingDate }
      - { id: cboStatus, type: COMBO, label: 审批状态, dataBinding: Booking.status }
    actions:
      - { actionId: actQuery, name: 查询, actionType: BUTTON, behaviorRef: Booking_QueryList }
      - { actionId: actDetail, name: 查看, actionType: BUTTON, behaviorRef: Booking_QueryDetail }

  - screenId: frmBookingApproval
    name: 预定审批
    screenType: APPROVAL_FORM
    elements:
      - { id: txtaComment, type: TEXTAREA, label: 审批意见, dataBinding: FlowTask.comment }
    actions:
      - { actionId: actApproveDept, name: 通过, actionType: APPROVE, behaviorRef: Booking_ApproveDept }
      - { actionId: actRejectDept, name: 驳回, actionType: REJECT, behaviorRef: Booking_ApproveDept }
      - { actionId: actApproveAdmin, name: 通过, actionType: APPROVE, behaviorRef: Booking_ApproveAdmin }
      - { actionId: actRejectAdmin, name: 驳回, actionType: REJECT, behaviorRef: Booking_ApproveAdmin }

  - screenId: frmRequested
    name: 我的申请
    screenType: QUERY_LIST
    elements:
      - { id: txtBookingNo, type: TEXTBOX, label: 预定编号, dataBinding: Booking.bookingNo }
      - { id: cboStatus, type: COMBO, label: 审批状态, dataBinding: Booking.status }
    actions:
      - { actionId: actWithdraw, name: 撤回, actionType: BUTTON, behaviorRef: Booking_Withdraw }

  - screenId: frmRoomSummaryReport
    name: 会议室预定统计
    screenType: QUERY_LIST
    elements:
      - { id: txtDateFrom, type: DATE, label: 预定日期起, dataBinding: Booking.bookingDate }
      - { id: txtDateTo, type: DATE, label: 预定日期止, dataBinding: Booking.bookingDate }
    actions:
      - { actionId: actQuery, name: 查询, actionType: BUTTON, behaviorRef: Booking_QueryRoomSummary }

  - screenId: frmRoomManage
    name: 会议室管理
    screenType: QUERY_LIST
    elements:
      - { id: txtRoomName, type: TEXTBOX, label: 会议室名称, dataBinding: MeetingRoom.roomName }
      - { id: txtCapacity, type: NUMBER, label: 容纳人数, dataBinding: MeetingRoom.capacity }
      - { id: txtLocation, type: TEXTBOX, label: 位置, dataBinding: MeetingRoom.location }
    actions:
      - { actionId: actQuery, name: 查询, actionType: BUTTON, behaviorRef: Room_QueryList }
      - { actionId: actCreate, name: 新增, actionType: BUTTON, behaviorRef: Room_Create }
